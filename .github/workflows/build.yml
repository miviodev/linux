name: Build Ubuntu Asahi kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: parallel=4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Install LXD
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y lxd

          sudo usermod -aG lxd "$USER"

          # GitHub runner shell не подхватит новую группу автоматически.
          # Используем sg, чтобы команды LXD выполнялись с группой lxd.
          sudo lxd waitready

      - name: Initialize LXD
        run: |
          set -eux

          sudo lxd init --auto

      - name: Launch Ubuntu 25.10 ARM64 container
        run: |
          set -eux

          sudo lxc remote add \
            --protocol simplestreams \
            ubuntu \
            https://cloud-images.ubuntu.com/releases/ \
            || true

          sudo lxc launch ubuntu:questing kernel-build

          sudo lxc config set kernel-build security.nesting true
          sudo lxc config set kernel-build security.privileged true

          # Даём контейнеру достаточно места под kernel build.
          sudo lxc config device override kernel-build root size=40GiB

          sudo lxc exec kernel-build -- bash -c '
            set -eux
            cat /etc/os-release
            dpkg --print-architecture
            uname -m
          '

      - name: Copy source into Ubuntu 25.10
        run: |
          set -eux

          sudo tar \
            --exclude=.git \
            -C . \
            -cf - . \
          | sudo lxc exec kernel-build -- tar -C /root -xf -

      - name: Prepare Ubuntu 25.10
        run: |
          set -eux

          sudo lxc exec kernel-build -- bash -c '
            set -eux

            export DEBIAN_FRONTEND=noninteractive

            apt-get update

            apt-get install -y \
              build-essential \
              ca-certificates \
              curl \
              debhelper \
              devscripts \
              dpkg-dev \
              equivs \
              fakeroot \
              git \
              sudo

            tee /etc/apt/sources.list.d/ubuntu-asahi.list > /dev/null <<EOF
          deb [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-asahi/ubuntu-asahi/ubuntu questing main
          deb-src [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-asahi/ubuntu-asahi/ubuntu questing main
          EOF

            apt-get update
          '

      - name: Prepare Debian packaging
        run: |
          set -eux

          sudo lxc exec kernel-build -- bash -c '
            set -eux
            cd /root

            cp debian.asahi-arm/changelog debian/changelog

            debian/rules debian/control
          '

      - name: Install kernel build dependencies
        run: |
          set -eux

          sudo lxc exec kernel-build -- bash -c '
            set -eux
            cd /root

            mk-build-deps \
              --install \
              --remove \
              --tool="apt-get -y --no-install-recommends" \
              debian/control
          '

      - name: Show toolchain
        run: |
          set -eux

          sudo lxc exec kernel-build -- bash -c '
            set -x

            echo "=== OS ==="
            cat /etc/os-release

            echo "=== ARCH ==="
            dpkg --print-architecture
            uname -m

            echo "=== RUST ==="
            rustc --version || true
            rustfmt --version || true

            echo "=== CLANG ==="
            clang --version || true
            clang-21 --version || true

            echo "=== LLVM ==="
            llc --version || true
            llc-21 --version || true
          '

      - name: Check build dependencies
        run: |
          set -eux

          sudo lxc exec kernel-build -- bash -c '
            set -eux
            cd /root
            dpkg-checkbuilddeps -B debian/control
          '

      - name: Build kernel packages
        run: |
          set -eux

          sudo lxc exec kernel-build -- bash -c '
            set -eux
            cd /root

            fakeroot debian/rules binary-arch
          '

      - name: Collect Debian packages
        run: |
          set -eux

          mkdir -p packages

          sudo lxc exec kernel-build -- bash -c '
            cd /root

            find .. -maxdepth 1 -type f \
              \( \
                -name "*.deb" \
                -o -name "*.changes" \
                -o -name "*.buildinfo" \
              \) \
              -print
          '

          sudo lxc file pull -r \
            kernel-build/root/../ \
            /tmp/kernel-output \
            2>/dev/null || true

          # Надёжнее собрать архив внутри контейнера.
          sudo lxc exec kernel-build -- bash -c '
            cd /root
            mkdir -p /tmp/packages

            find .. -maxdepth 1 -type f \
              \( \
                -name "*.deb" \
                -o -name "*.changes" \
                -o -name "*.buildinfo" \
              \) \
              -exec cp -v {} /tmp/packages/ \;

            tar -C /tmp/packages -czf /tmp/kernel-packages.tar.gz .
          '

          sudo lxc file pull \
            kernel-build/tmp/kernel-packages.tar.gz \
            packages/kernel-packages.tar.gz

          tar -xzf packages/kernel-packages.tar.gz \
            -C packages

          rm packages/kernel-packages.tar.gz

          echo "=== PACKAGES ==="
          find packages -type f -print | sort

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-asahi-kernel-arm64
          path: packages/
          if-no-files-found: error
          retention-days: 30
