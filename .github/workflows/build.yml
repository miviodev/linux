name: Build Ubuntu Asahi kernel packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    # Собираем строго внутри Ubuntu 25.10 (questing), а не на хосте 26.04.
    # Это критично: debian.asahi-arm/config/annotations фиксирует ожидаемые
    # CONFIG_RUSTC_VERSION / CONFIG_RUSTC_LLVM_VERSION под тот rustc/rust-src,
    # что лежат в PPA ubuntu-asahi именно для questing. Если собирать на
    # хосте 26.04 (или добавить PPA под resolute), apt подтянет более новый
    # системный rustc, чем тот rust-src, под который собран Asahi PPA —
    # rustc и sysroot core-библиотеки разъедутся по версии, и
    # scripts/rust_is_available.sh перестанет находить core, из-за чего
    # check-config молча схлопывает CONFIG_RUST_IS_AVAILABLE y -> -
    # (и вместе с ним отваливается asahi DRM-драйвер, он на Rust).
    container:
      image: ubuntu:questing

    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: parallel=4

    steps:
      - name: Install git (needed for checkout inside minimal container)
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Show build environment
        run: |
          set -eux

          echo "=== OS ==="
          cat /etc/os-release

          echo "=== Architecture ==="
          dpkg --print-architecture
          dpkg-architecture -qDEB_HOST_ARCH
          uname -m

          echo "=== Kernel (host, не гостевой) ==="
          uname -a

      - name: Add Ubuntu Asahi repository (questing, совпадает с образом контейнера)
        run: |
          set -eux

          tee /etc/apt/sources.list.d/ubuntu-asahi.list > /dev/null <<'EOF'
          deb [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-asahi/ubuntu-asahi/ubuntu questing main
          deb-src [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-asahi/ubuntu-asahi/ubuntu questing main
          EOF

          apt-get update

      - name: Install Debian build tools
        run: |
          set -eux

          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            equivs \
            fakeroot \
            dpkg-dev \
            git

      - name: Prepare Debian packaging
        run: |
          set -eux

          # Ubuntu kernel packaging keeps the active changelog
          # in the selected DEBIAN tree (debian.asahi-arm).
          # dh_installchangelogs expects debian/changelog.
          cp debian.asahi-arm/changelog debian/changelog

      - name: Generate Debian control
        run: |
          set -eux

          debian/rules debian/control

          echo "=== Generated source package metadata ==="
          head -80 debian/control

      - name: Install all build dependencies
        run: |
          set -eux

          mk-build-deps \
            --install \
            --remove \
            --tool='apt-get -y --no-install-recommends' \
            debian/control

      - name: Verify build dependencies
        run: |
          set -eux

          dpkg-checkbuilddeps -B debian/control

      - name: Show toolchain versions (для сверки с debian.asahi-arm/config/annotations)
        run: |
          set -eux

          echo "=== RUST ==="
          rustc --version || true
          rustfmt --version || true
          bindgen --version || true

          echo "=== CLANG / LLVM ==="
          clang --version || true
          llvm-config --version || true

      - name: Build ARM64 kernel packages
        run: |
          set -eux

          fakeroot debian/rules binary-arch

      - name: Show generated packages
        if: always()
        run: |
          echo "=== Generated Debian packages ==="

          find .. -maxdepth 1 -type f \
            \( \
              -name '*.deb' \
              -o -name '*.changes' \
              -o -name '*.buildinfo' \
            \) \
            -print | sort

      - name: Collect packages
        if: success()
        run: |
          set -eux

          mkdir -p packages

          find .. -maxdepth 1 -type f \
            \( \
              -name '*.deb' \
              -o -name '*.changes' \
              -o -name '*.buildinfo' \
            \) \
            -exec cp -v {} packages/ \;

          echo "=== Packages to upload ==="
          ls -lah packages

      - name: Upload Debian packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-asahi-kernel-arm64
          path: packages/
          if-no-files-found: error
          retention-days: 30
