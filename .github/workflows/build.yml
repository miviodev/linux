name: Build Ubuntu Asahi kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: ubuntu:resolute

    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: parallel=4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Configure repositories
        run: |
          cat > /etc/apt/sources.list.d/ubuntu.sources <<'EOF'
          Types: deb deb-src
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: resolute resolute-updates resolute-security
          Components: main universe restricted multiverse
          EOF

          cat > /etc/apt/sources.list.d/ubuntu-asahi.list <<'EOF'
          deb [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-asahi/ubuntu-asahi/ubuntu resolute main
          EOF

          apt-get update

      - name: Install build tools
        run: |
          apt-get install -y \
            build-essential \
            devscripts \
            equivs \
            fakeroot \
            dpkg-dev \
            debhelper \
            ca-certificates \
            git

      - name: Generate Debian control
        run: |
          debian/rules debian/control

      - name: Show generated Build-Depends
        run: |
          sed -n '/^Build-Depends:/,/^[^ ]/p' debian/control || true

      - name: Install build dependencies
        run: |
          mk-build-deps \
            --install \
            --remove \
            --tool='apt-get -y --no-install-recommends' \
            debian/control

      - name: Verify architecture
        run: |
          dpkg --print-architecture
          dpkg-architecture
          uname -m

      - name: Build kernel packages
        run: |
          fakeroot debian/rules binary-arch

      - name: Collect packages
        run: |
          mkdir -p packages

          find .. -maxdepth 1 -type f \
            \( \
              -name '*.deb' \
              -o -name '*.changes' \
              -o -name '*.buildinfo' \
            \) \
            -exec cp -v {} packages/ \;

          echo "=== Packages ==="
          ls -lah packages

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-asahi-kernel
          path: packages/
          if-no-files-found: error
          retention-days: 30
