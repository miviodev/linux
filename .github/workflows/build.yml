name: Build Ubuntu Asahi kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 kernel packages
    runs-on: ubuntu-24.04-arm

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Show source revision
        run: |
          echo "Kernel source:"
          git log -1 --oneline
          echo
          echo "Kernel version:"
          make -s kernelversion || true
          echo
          echo "Asahi packaging:"
          cat debian/debian.env
          cat debian.asahi-arm/variants

      - name: Enable source repositories
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - name: Install build tools
        run: |
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            devscripts \
            equivs \
            dpkg-dev \
            debhelper \
            bc \
            bison \
            flex \
            gawk \
            git \
            rsync \
            cpio \
            kmod \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            dwarves \
            pahole \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-yaml \
            pkg-config \
            openssl \
            xz-utils \
            zstd \
            lz4 \
            ccache

      - name: Generate Debian control file
        run: |
          debian/rules debian/control

      - name: Install Ubuntu kernel build dependencies
        run: |
          sudo apt-get build-dep -y .

      - name: Build Debian packages
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: |
          fakeroot debian/rules binary

      - name: List generated packages
        run: |
          echo "Generated Debian packages:"
          find .. -maxdepth 1 -type f -name '*.deb' -print | sort

      - name: Collect packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/packages"

          find .. -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.changes' -o -name '*.buildinfo' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/packages/" \;

          echo
          echo "Packages:"
          ls -lah "$GITHUB_WORKSPACE/packages"

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-asahi-kernel-debs
          path: packages/
          if-no-files-found: error
          retention-days: 30
