name: Build Ubuntu Asahi kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: parallel=4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Enable source repositories
        run: |
          sudo sed -i \
            's/^Types: deb$/Types: deb deb-src/' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - name: Install LLVM 21
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21

          sudo apt-get install -y \
            clang-21 \
            llvm-21 \
            llvm-21-dev

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            autoconf \
            automake \
            bc \
            bindgen \
            bison \
            bpftool \
            cpio \
            curl \
            debhelper-compat \
            default-jdk-headless \
            dkms \
            flex \
            gawk \
            java-common \
            kmod \
            libaudit-dev \
            libbpf-dev \
            libcap-dev \
            libdebuginfod-dev \
            libdw-dev \
            libelf-dev \
            libiberty-dev \
            liblzma-dev \
            libnewt-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libnuma-dev \
            libpci-dev \
            libssl-dev \
            libstdc++-dev \
            libtool \
            libtraceevent-dev \
            libtracefs-dev \
            libudev-dev \
            libunwind8-dev \
            pahole \
            pkg-config \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            uuid-dev \
            zstd

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rust-src rustfmt

      - name: Generate Debian control
        run: |
          debian/rules debian/control

      - name: Verify build dependencies
        run: |
          dpkg-checkbuilddeps -B

      - name: Build ARM64 Debian packages
        run: |
          fakeroot debian/rules binary-arch

      - name: Show packages
        if: always()
        run: |
          find .. -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.changes' -o -name '*.buildinfo' \) \
            -print | sort

      - name: Collect packages
        run: |
          mkdir -p packages

          find .. -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.changes' -o -name '*.buildinfo' \) \
            -exec cp -v {} packages/ \;

          ls -lah packages

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-asahi-kernel
          path: packages/
          if-no-files-found: error
          retention-days: 30
