name: Build Ubuntu Asahi kernel packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: parallel=4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Show build environment
        run: |
          set -eux

          echo "=== OS ==="
          cat /etc/os-release

          echo "=== Architecture ==="
          dpkg --print-architecture
          dpkg-architecture -qDEB_HOST_ARCH
          uname -m

          echo "=== Kernel ==="
          uname -a

      - name: Add Ubuntu Asahi repository
        run: |
          set -eux

          sudo tee /etc/apt/sources.list.d/ubuntu-asahi.list > /dev/null <<'EOF'
          deb [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-asahi/ubuntu-asahi/ubuntu resolute main
          deb-src [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-asahi/ubuntu-asahi/ubuntu resolute main
          EOF

          sudo apt-get update

      - name: Install Debian build tools
        run: |
          set -eux

          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            equivs \
            fakeroot \
            dpkg-dev \
            ca-certificates \
            git

      - name: Prepare Debian packaging
        run: |
          set -eux

          # Ubuntu kernel packaging keeps the active changelog
          # in the selected DEBIAN tree (debian.asahi-arm).
          # dh_installchangelogs expects debian/changelog.
          cp debian.asahi-arm/changelog debian/changelog

      - name: Generate Debian control
        run: |
          set -eux

          debian/rules debian/control

          echo "=== Generated source package metadata ==="
          head -80 debian/control

      - name: Install all build dependencies
        run: |
          set -eux

          mk-build-deps \
            --install \
            --remove \
            --tool='apt-get -y --no-install-recommends' \
            debian/control

      - name: Verify build dependencies
        run: |
          set -eux

          dpkg-checkbuilddeps -B debian/control

      - name: Build ARM64 kernel packages
        run: |
          set -eux

          fakeroot debian/rules binary-arch

      - name: Show generated packages
        if: always()
        run: |
          echo "=== Generated Debian packages ==="

          find .. -maxdepth 1 -type f \
            \( \
              -name '*.deb' \
              -o -name '*.changes' \
              -o -name '*.buildinfo' \
            \) \
            -print | sort

      - name: Collect packages
        if: success()
        run: |
          set -eux

          mkdir -p packages

          find .. -maxdepth 1 -type f \
            \( \
              -name '*.deb' \
              -o -name '*.changes' \
              -o -name '*.buildinfo' \
            \) \
            -exec cp -v {} packages/ \;

          echo "=== Packages to upload ==="
          ls -lah packages

      - name: Upload Debian packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-asahi-kernel-arm64
          path: packages/
          if-no-files-found: error
          retention-days: 30
